[project]
name = "aaf-discovery"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "apscheduler>=3.11.3",
    "certifi>=2026.6.17",
    "fastapi[standard]>=0.139.0",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "lxml>=6.1.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "signxml>=5.1.0",
    "valkey>=6.1.1",
]

[dependency-groups]
dev = [
    "fakeredis[valkey]>=2.36.2",
    "httpx2>=2.7.0",
    "marimo[lsp]>=0.23.13",
    "polars[excel]>=1.42.1",
    "polyfactory>=3.3.0",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "pytest-sugar>=1.1.1",
    "respx>=0.23.1",
    "ruff>=0.15.21",
    "ty>=0.0.59",
    "types-lxml>=2026.2.16",
]

[tool.pytest]
minversion = "9.0"
addopts = [
    "--cov=aaf",
    "--cov=cache",
    "--cov=proxy"
]
testpaths = [
    "tests"
]
pythonpath = ["."]

[tool.coverage.run]
omit = [
    "tests/*"
]

[tool.marimo.language_servers.pylsp]
enabled = true               # Enable/disable pylsp

[tool.ty.src]
exclude = ["notebooks"]

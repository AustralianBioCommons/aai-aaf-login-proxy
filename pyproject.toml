[project]
name = "aaf-discovery"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "apscheduler>=3.11.3",
    "certifi>=2026.6.17",
    "fastapi[standard]>=0.139.0",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "lxml>=6.1.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "signxml>=5.1.0",
    "valkey[libvalkey]>=6.1.1",
]

[dependency-groups]
dev = [
    "marimo[lsp]>=0.23.13",
    "polars[excel]>=1.42.1",
    "pre-commit>=4.6.0",
    "ruff>=0.15.21",
    "ty>=0.0.59",
]

[tool.marimo.language_servers.pylsp]
enabled = true               # Enable/disable pylsp

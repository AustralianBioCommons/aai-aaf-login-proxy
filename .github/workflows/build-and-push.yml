name: build-and-push

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  IMAGE_REPO: ${{ secrets.AWS_ECR_IMAGE_REPO }}
  IMAGE_TAG: dev-aaf
  DEPLOY_DEV_AAF: 'false'

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Validate required secrets
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ECR_IMAGE_REPO: ${{ secrets.AWS_ECR_IMAGE_REPO }}
          AWS_ROLE_ECR_PUSH: ${{ secrets.AWS_ROLE_ECR_PUSH }}
        run: |
          set -euo pipefail

          if [ -z "${AWS_REGION}" ]; then
            echo "Missing required secret AWS_REGION" >&2
            exit 1
          fi
          if [ -z "${AWS_ECR_IMAGE_REPO}" ]; then
            echo "Missing required secret AWS_ECR_IMAGE_REPO" >&2
            exit 1
          fi
          if [ -z "${AWS_ROLE_ECR_PUSH}" ]; then
            echo "Missing required secret AWS_ROLE_ECR_PUSH" >&2
            exit 1
          fi

      - uses: docker/setup-buildx-action@v4

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ECR_PUSH }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push dev-aaf image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate deploy secrets
        if: env.DEPLOY_DEV_AAF == 'true'
        env:
          AWS_ROLE_DEPLOY_DEV_AAF: ${{ secrets.AWS_ROLE_DEPLOY_DEV_AAF }}
          AWS_DEPLOY_FUNCTION_DEV_AAF: ${{ secrets.AWS_DEPLOY_FUNCTION_DEV_AAF }}
        run: |
          set -euo pipefail

          if [ -z "${AWS_ROLE_DEPLOY_DEV_AAF}" ]; then
            echo "Missing required secret AWS_ROLE_DEPLOY_DEV_AAF" >&2
            exit 1
          fi
          if [ -z "${AWS_DEPLOY_FUNCTION_DEV_AAF}" ]; then
            echo "Missing required secret AWS_DEPLOY_FUNCTION_DEV_AAF" >&2
            exit 1
          fi

      - name: Configure deploy credentials
        if: env.DEPLOY_DEV_AAF == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_DEPLOY_DEV_AAF }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: true

      - name: Deploy dev-aaf
        if: env.DEPLOY_DEV_AAF == 'true'
        env:
          AWS_DEPLOY_FUNCTION_DEV_AAF: ${{ secrets.AWS_DEPLOY_FUNCTION_DEV_AAF }}
        run: |
          set -euo pipefail

          aws lambda invoke \
            --function-name "${AWS_DEPLOY_FUNCTION_DEV_AAF}" \
            --cli-binary-format raw-in-base64-out \
            --payload "{\"tag\":\"${IMAGE_TAG}\"}" \
            /tmp/aaf-login-proxy-deploy.json

          cat /tmp/aaf-login-proxy-deploy.json

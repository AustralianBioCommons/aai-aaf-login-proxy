services:
  aaf-proxy:
    build: .
    image: aaf-proxy
    env_file:
      - .env
    environment:
      VALKEY_HOST: valkey
      VALKEY_PORT: 6379
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}
    ports:
      - "8000:8000"
    depends_on:
      valkey:
        condition: service_healthy

  valkey:
    image: valkey/valkey:latest
    command: ["valkey-server", "--requirepass", "${VALKEY_PASSWORD}"]
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${VALKEY_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - valkey-data:/data

volumes:
  valkey-data:
